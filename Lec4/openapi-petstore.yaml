openapi: 3.0.3
info:
  title: Petstore API
  description: API quản lý thú cưng trong cửa hàng.
  version: 1.0.0
  contact:
    name: Lec 4 - OpenAPI practice

servers:
  - url: http://localhost:5000/v1
    description: Local development server

tags:
  - name: pets
    description: Các thao tác với thú cưng

security:
  - apiKeyAuth: []

paths:
  /pets:
    get:
      tags: [pets]
      summary: Liệt kê thú cưng
      operationId: listPets
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Status'
      responses:
        '200':
          description: Danh sách thú cưng
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [pets]
      summary: Tạo thú cưng mới
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: Thú cưng đã được tạo
          headers:
            Location:
              description: URL của thú cưng vừa tạo
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /pets/{petId}:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [pets]
      summary: Lấy thông tin một thú cưng
      operationId: getPetById
      responses:
        '200':
          description: Thông tin thú cưng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [pets]
      summary: Cập nhật một phần thông tin thú cưng
      operationId: updatePet
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdatePet'
      responses:
        '200':
          description: Thú cưng sau khi cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [pets]
      summary: Xóa thú cưng
      operationId: deletePet
      responses:
        '204':
          description: Đã xóa thú cưng thành công
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    PetId:
      name: petId
      in: path
      required: true
      description: ID của thú cưng
      schema:
        type: integer
        format: int64
        minimum: 1
    Limit:
      name: limit
      in: query
      description: Số lượng thú cưng tối đa cần trả về
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    Status:
      name: status
      in: query
      description: Lọc theo trạng thái thú cưng
      schema:
        type: string
        enum: [available, pending, sold]

  responses:
    BadRequest:
      description: Request không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Thiếu hoặc không hợp lệ API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy thú cưng
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Dữ liệu không vượt qua validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Lỗi máy chủ không xác định
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Pet:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: doggie
        category:
          $ref: '#/components/schemas/Category'
        photoUrls:
          type: array
          minItems: 1
          items:
            type: string
            format: uri
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        status:
          type: string
          enum: [available, pending, sold]
          default: available

    NewPet:
      type: object
      required: [name, photoUrls]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        category:
          $ref: '#/components/schemas/Category'
        photoUrls:
          type: array
          minItems: 1
          items:
            type: string
            format: uri
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        status:
          type: string
          enum: [available, pending, sold]
          default: available

    UpdatePet:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        category:
          $ref: '#/components/schemas/Category'
        photoUrls:
          type: array
          minItems: 1
          items:
            type: string
            format: uri
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        status:
          type: string
          enum: [available, pending, sold]

    Category:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Dogs

    Tag:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: friendly

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: PET_NOT_FOUND
        message:
          type: string
          example: Không tìm thấy thú cưng
