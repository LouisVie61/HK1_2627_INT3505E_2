services:
  product-api:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: sqlite:////data/products.db
      FLASK_DEBUG: "0"
    volumes:
      - product-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  product-data:

